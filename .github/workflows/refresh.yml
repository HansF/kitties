name: Hourly refresh

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (top of the hour is congested on GitHub)
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scrape adopteereendier.be
        run: python refresh.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh $(date -u +'%Y-%m-%d %H:%M') UTC: $(python -c "import json;print(len(json.load(open('data/new.json',encoding='utf-8'))))") new"
            git push
          fi
